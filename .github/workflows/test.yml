name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.26"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check Python style
        run: |
          uv run ruff format --check
          uv run ruff check --output-format github
      - name: Run tests without paid APIs
        run: uv run pytest -q

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the API and interface images
        run: |
          docker build -f docker/Dockerfile.service -t ecommerce-support-service:ci .
          docker build -f docker/Dockerfile.app -t ecommerce-support-ui:ci .
